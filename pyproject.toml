[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bidsmgr"
version = "0.0.1"
description = "Schema-driven BIDS converter, curator, and editor (successor to BIDS-Manager v0.2.5)"
readme = "README.md"
license = "MIT"
authors = [{name = "Karel López Vilaret", email = "karel.mauricio.lopez.vilaret@uni-oldenburg.de"}]
keywords = ["BIDS", "DICOM", "EEG", "MEG", "GUI", "Neuroimaging"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # Schema engine — the keystone of the architecture (architecture.md §3)
    "bidsschematools>=1.0.0",
    "ancpbids>=0.3.1",

    # GUI (architecture.md §15.6)
    "PyQt6==6.11.0",

    # Strongly-typed core abstractions (architecture.md §2)
    "pydantic>=2.6",

    # MRI conversion stack — dcm2niix invoked directly (architecture.md §15.5)
    "dcm2niix==1.0.20250506",
    "pydicom==3.0.1",
    "nibabel>=5.3",

    # EEG / MEG / iEEG conversion stack
    "mne>=1.6",
    "mne-bids>=0.15",
    "edfio",

    # Physio (Siemens PhysioLog DICOM → BIDS)
    "bidsphysio==21.6.24",
    "setuptools<81",  # bidsphysio still uses pkg_resources.declare_namespace

    # Data handling
    "pandas>=2.0",
    "numpy>=1.26",
    "joblib>=1.4",

    # Optional editor visualisation deps (carried over from BIDS-Manager v0.2.5)
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/ANCPLabOldenburg/BIDS-Manager"
"Sibling (v0.2.5)" = "https://github.com/ANCPLabOldenburg/BIDS-Manager"

[project.scripts]
bidsmgr           = "bidsmgr.main:main"
bidsmgr-scan      = "bidsmgr.cli.scan:main"
bidsmgr-classify  = "bidsmgr.cli.classify:main"
bidsmgr-plan      = "bidsmgr.cli.plan:main"
bidsmgr-convert   = "bidsmgr.cli.convert:main"
bidsmgr-rebuild   = "bidsmgr.cli.rebuild:main"
bidsmgr-metadata  = "bidsmgr.cli.metadata:main"
bidsmgr-validate  = "bidsmgr.cli.validate:main"

[tool.setuptools]
packages = [
    "bidsmgr",
    "bidsmgr.schema",
    "bidsmgr.inventory",
    "bidsmgr.classifier",
    "bidsmgr.planner",
    "bidsmgr.converter",
    "bidsmgr.converter.backends",
    "bidsmgr.metadata",
    "bidsmgr.fixups",
    "bidsmgr.project",
    "bidsmgr.editor",
    "bidsmgr.gui",
    "bidsmgr.gui.widgets",
    "bidsmgr.gui.delegates",
    "bidsmgr.gui.models",
    "bidsmgr.workers",
    "bidsmgr.cli",
]
include-package-data = true

[tool.setuptools.package-data]
"bidsmgr.gui" = ["*.qss"]
"bidsmgr.schema" = ["bundled/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "real_data: requires real datasets at /Users/karelo/Development/datasets/BIDS_Manager/raw_data — gated on env vars BIDS_MANAGER_REAL_{MRI,MEG,EEG}_DATA",
    "gui: pytest-qt smoke tests, headless OK with QT_QPA_PLATFORM=offscreen",
]
